[program:cursor-agent]
directory=/home/t
command=/home/t/comagic-mobile/scripts/serve-cursor.sh
user=t
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cursor-agent.log
environment=PYTHONUNBUFFERED="1",HOME="/home/t",COMAGIC_REGISTRY="http://192.168.100.136:4908",PATH="/home/t/.local/bin:/usr/bin:/bin"
