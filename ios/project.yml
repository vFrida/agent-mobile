name: AgentMobile
options:
  bundleIdPrefix: net.agents
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  AgentMobile:
    type: application
    platform: iOS
    sources:
      - path: AgentMobile
    info:
      path: AgentMobile/Info.plist
      properties:
        CFBundleDisplayName: Agents
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 语音输入消息
        NSSpeechRecognitionUsageDescription: 将语音转换成文字
        NSPhotoLibraryUsageDescription: 选择图片发送给 agent
        CFBundleURLTypes:
          - CFBundleURLName: net.agents.mobile.pair
            CFBundleURLSchemes:
              - comagic
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.agents.mobile
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  AgentMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgentMobileTests
    dependencies:
      - target: AgentMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.agents.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AgentMobile:
    build:
      targets:
        AgentMobile: all
        AgentMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentMobileTests
