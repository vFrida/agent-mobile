name: ComagicMobile
options:
  bundleIdPrefix: net.pdd.comagic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ComagicMobile:
    type: application
    platform: iOS
    sources:
      - path: ComagicMobile
    info:
      path: ComagicMobile/Info.plist
      properties:
        CFBundleDisplayName: Comagic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 语音输入消息
        NSSpeechRecognitionUsageDescription: 将语音转换成文字
        NSPhotoLibraryUsageDescription: 选择图片发送给 agent
        CFBundleURLTypes:
          - CFBundleURLName: net.pdd.comagic.mobile.pair
            CFBundleURLSchemes:
              - comagic
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.pdd.comagic.mobile
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  ComagicMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ComagicMobileTests
    dependencies:
      - target: ComagicMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.pdd.comagic.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ComagicMobile:
    build:
      targets:
        ComagicMobile: all
        ComagicMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ComagicMobileTests
